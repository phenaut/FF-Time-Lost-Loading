<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="settings">
    <h1>Paramètres</h1>
    <div class="about-line">
      <span>Version 1.9.2</span>
      <span aria-hidden="true"> | </span>
      <span>Pierre Henaut</span>
      <span aria-hidden="true"> | </span>
      <a href="https://github.com/phenaut/FF-Time-Lost-Loading" target="_blank" rel="noopener noreferrer">github.com/phenaut/FF-Time-Lost-Loading</a>
    </div>
    <form id="form" class="card">
      <label class="active">
        <input id="enabled" type="checkbox">
        <span>Actif</span>
      </label>
      <label>
        Domaines exclus (un par ligne)
        <textarea id="excludePatterns" rows="4" placeholder="localhost&#10;127.0.0.1&#10;*.google.com"></textarea>
      </label>
      <label>
        Seuil page lente (ms)
        <input id="slowThresholdMs" type="number">
      </label>
      <button>Enregistrer</button>
      <span id="saved"></span>
    </form>
    <button id="reset" class="danger">Effacer les mesures</button>
  </main>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
